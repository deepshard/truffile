metadata:
  name: Whoop
  bundle_id: org.truffle.whoop.bridge
  description: |
    Read your WHOOP profile, recovery, sleep, cycle, and workout data. During install, authorize access to your
    WHOOP account through OAuth.
  icon_file: ./icon.png
  background:
    process:
      cmd:
        - python
        - whoop_background.py
      working_directory: /
      environment:
        PYTHONUNBUFFERED: "1"
        WHOOP_BG_LOOKBACK_DAYS: "14"
        WHOOP_BG_OVERLAP_HOURS: "2"
        WHOOP_BG_SCAN_LIMIT: "25"
    default_schedule:
      type: interval
      interval:
        duration: 12h
        daily_window: 00:00-23:59
  foreground:
    process:
      cmd:
        - python
        - foreground.py
      working_directory: /
      environment:
        PYTHONUNBUFFERED: "1"

steps:
  - name: Install Python dependencies
    type: bash
    update_policy: run_on_update
    run: |
      pip install --no-cache-dir "httpx>=0.27.0"

  - name: Copy application files
    type: files
    update_policy: run_on_update
    files:
      - source: ./config.py
        destination: ./config.py
      - source: ./whoop_auth.py
        destination: ./whoop_auth.py
      - source: ./whoop_client.py
        destination: ./whoop_client.py
      - source: ./tools.py
        destination: ./tools.py
      - source: ./foreground.py
        destination: ./foreground.py
      - source: ./whoop_background.py
        destination: ./whoop_background.py
      - source: ./bg_worker.py
        destination: ./bg_worker.py

  - name: WHOOP OAuth Sign-In
    type: oauth
    update_policy: run_on_update
    update_check: python ./foreground.py --verify
    provider: Whoop
    description: Sign in to WHOOP to connect your profile, body measurements, cycles, recovery, sleep, and workouts.
    client_id: fa532359-6265-491d-b7e2-4941e1416a9c
    client_secret: eb4d639d2ea00a1c69a52793d17bd94ed2f8073517161e929451d0427d08d9c0
    client_secret_env: null
    redirect_uri: https://truffle.net/api/oauth/callback
    auth_endpoint: https://api.prod.whoop.com/oauth/oauth2/auth
    token_endpoint: https://api.prod.whoop.com/oauth/oauth2/token
    scopes:
      - offline
      - read:profile
      - read:body_measurement
      - read:cycles
      - read:recovery
      - read:sleep
      - read:workout
    prompt: null
    access_type: null
    include_granted_scopes: false
    ui_state_on_show: user_interaction_ready
    ui_state_on_complete: move_to_background
    token_output_file: /root/.whoop-truffle/oauth.json
    token_file_env_name: WHOOP_TOKEN_STORE_PATH
    app_var_key: oauth_state

  - name: Verify WHOOP OAuth
    type: bash
    update_policy: run_on_update
    run: python ./foreground.py --verify
