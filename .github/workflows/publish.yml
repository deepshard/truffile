name: Build and Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PYFW_DEPLOY_KEY }}

      - name: clone pyfw
        run: git clone --depth 1 git@github.com:deepshard/pyfw.git _pyfw

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: install build deps
        run: pip install grpcio-tools==1.76.0 protobuf>=6.30.0 googleapis-common-protos>=1.63.2 build setuptools-scm

      - name: build package
        run: python scripts/build_package.py --pyfw-path ./_pyfw

      - name: build wheel
        run: python -m build

      - name: publish to pypi
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}

      - name: cleanup
        if: always()
        run: rm -rf _pyfw
