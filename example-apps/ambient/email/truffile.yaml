metadata:
  name: Inbox
  type: background
  description: |
    Connect Truffle¹ to your email inbox and notify you of relevant messages.
  process:
    cmd:
      - python
      - email_ambient.py
    working_directory: /
    environment:
      PYTHONUNBUFFERED: "1"
      IMAP_PORT: "993"

  icon_file: ./icon.png
  default_schedule:
    type: interval
    interval: 
      duration: 5m
      schedule:
      daily_window: "01:00-22:30"      # optional
steps:
  - name: Email Setup
    type: welcome
    content: |
      The Email app is a generic IMAP email client that will allow your Truffle to post emails on your feed.
      You will need a one time passcode from your email provider if you have 2FA enabled. 
      For Gmail, you can generate an App Password from your Google Account settings.
      [Click Here to get one](https://support.google.com/mail/answer/185833?hl=en)
  - name: Install dependencies
    type: bash
    run: |
      pip install --no-cache-dir trafilatura==2.0.0 
  - name: Copy application files
    type: files
    files:
      - source: ./email_ambient.py
        destination: ./email_ambient.py
  - name: Configure Email Account
    type: text
    content: |
      Please provide an IMAP server, email address, and password to configure your email account. Port 993/SSL is assumed.
      Common IMAP servers:
      - Gmail: `imap.gmail.com`
      - Hotmail/Outlook: `imap-mail.outlook.com`
      - Yahoo: `imap.mail.yahoo.com`
      - iCloud: `imap.mail.me.com`
      Be warned only Gmail has been tested. 

    fields:
      - name: imap_server
        label: IMAP Server
        type: text 
        placeholder: imap.gmail.com 
        default: imap.gmail.com
        env: IMAP_SERVER 
      - name: email_address
        label: Email Address
        type: text
        env: EMAIL_ADDRESS
        placeholder: robert@gmail.com
      - name: password
        label: Password
        type: password
        env: EMAIL_PASSWORD
    validator:
      type: bash # [bash]
      run: |
        python ./email_ambient.py --verify
      timeout: 120 # optional, in seconds
      error_message: | # optional
        Could not connect to the email server with the provided credentials. Please double-check and try again
      
  



  