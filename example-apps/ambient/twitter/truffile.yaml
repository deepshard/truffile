metadata:
  name: Xeet
  type: background
  description: |
    Enable your Truffle¹ to browse your X feed and post curated content to your client.
    By downloading Xeet to your Truffle account, you assume full legal and financial responsibility for the use of this software on your Truffle¹ and agree that Deepshard shall not be liable for any actions you take with Xeet.
    Deepshard is not affiliated with X. Users must abide by X's terms of service. This application is for demonstration purposes only.
  process:
    cmd:
      - python
      - ambient.py
    working_directory: /
    environment:
      PYTHONUNBUFFERED: "1"
  icon_file: ./icon.png
  default_schedule:
    type: interval
    interval: 
      duration: 30m
steps:
  - name: Welcome
    type: welcome
    content: |
      Welcome to Xeet. 
      This app will allow your Truffle to post tweets from accounts you follow directly to your feed.
      This app does not condone the use of bots or automation that violates X's terms of service. 
      Using this app violates any and all terms of service of Truffle. Deepshard will not be held responsible for any actions taken by X against your account.
  - name: Copy application files
    type: files
    files:
      - source: ./ambient.py
        destination: ./ambient.py
      - source: ./onboard.py
        destination: ./onboard.py
  - name: Install dependencies
    type: bash
    run: |
      pip install requests undetected-chromedriver selenium
  - name: Sign into X
    type: vnc 
    cmd:
      - python
      - onboard.py
    closes_on_complete: true
    description: |
      A VNC window will open. Please sign into your X account to continue the installation. 
      This app does not condone the use of bots or automation that violates X's terms of service.
      If the tab glitches out, press Ctrl+T to break out of fullscreen mode and try again.
      Installation will continue once you have successfully signed in.
  - name: Finalize installation
    type: bash
    run: |
      sync || true



  



  