metadata:
  name: Hacker News 
  type: background
  description: |
    An internal test app for VNC and auth flow. May or may not scrape Hacker News.
  process:
    cmd:
      - python
      - ambient.py
    working_directory: /
    environment:
      PYTHONUNBUFFERED: "1"
  icon_file: ./icon.png
  default_schedule:
    type: interval
    interval: 
      duration: 1m
steps:
  - name: Welcome
    type: welcome
    content: |
      This is literally just a test for VNC
  - name: Copy application files
    type: files
    files:
      - source: ./ambient.py
        destination: ./ambient.py
      - source: ./onboard.py
        destination: ./onboard.py
  - name: Install dependencies
    type: bash
    run: |
      pip install --no-cache-dir requests undetected-chromedriver selenium beautifulsoup4
      pip install --no-cache-dir -i https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ 'gourmet[abrasive]==0.1.dev44'
      pip install --no-cache-dir --force-reinstall requests feedparser trafilatura==2.0.0 tld==0.13.1 
  - name: Sign into Hacker News
    type: vnc 
    cmd:
      - python
      - onboard.py
    closes_on_complete: true
    description: |
      A VNC window will open. Please sign into your HackerNews account to continue the installation.
 

  



  