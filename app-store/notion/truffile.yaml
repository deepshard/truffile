metadata:
  name: Notion
  bundle_id: org.deepshard.notion
  description: |
    Access and edit your Notion workspace with Truffle.
  icon_file: ./icon.png
  foreground:
    process:
      cmd:
        - python
        - notion_foreground.py
      working_directory: /
      environment:
        PYTHONUNBUFFERED: "1"

steps:
  - name: Install dependencies
    type: bash
    run: |
      apk add --no-cache nodejs npm
      npm install -g @notionhq/notion-mcp-server

  - name: Copy app files
    type: files
    files:
      - source: ./auth.py
        destination: ./auth.py
      - source: ./config.py
        destination: ./config.py
      - source: ./notion_client.py
        destination: ./notion_client.py
      - source: ./notion_foreground.py
        destination: ./notion_foreground.py

  - name: Configure Notion access token
    type: text
    content: |
      Enter a Notion internal integration token so Truffle can read and edit your workspace.

      To create one:
      1. Go to https://www.notion.so/profile/integrations
      2. Click **New integration**, name it (e.g. "Truffle")
      3. Pick the workspace you want to connect
      4. Under **Capabilities**, select the permissions you want to grant
      5. Save, copy the "Internal Integration Secret", and paste it below
      6. In Notion, share the pages/databases you want Truffle to see with this integration

      The token is stored only on your Truffle device.
    fields:
      - name: notion_access_token
        label: Notion Access Token
        type: password
        placeholder: ntn_...
        env: NOTION_ACCESS_TOKEN
    validator:
      type: bash
      run: |
        python ./notion_foreground.py --verify
      timeout: 90
      error_message: |
        Could not verify NOTION_ACCESS_TOKEN. Check the token is valid and that the integration has access to at least one page.
